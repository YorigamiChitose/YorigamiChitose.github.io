name: Auto Deploy hugo

on:
  push:
    branches:
      - main  # 触发工作流的 Git 分支

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest  # 运行工作流的操作系统

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4  # 检出仓库代码
        with:
          submodules: recursive  # 递归检出子模块
          fetch-depth: 1  # 只获取最新的提交记录

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3  # 设置 Hugo 环境
        with:
          hugo-version: latest  # 使用最新版本的 Hugo
          extended: true  # 使用扩展版本的 Hugo

      - name: Build
        run: hugo --minify  # 使用 Hugo 构建网站, 并最小化输出

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4  # 部署到 GitHub Pages
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}  # 使用部署密钥
          external_repository: ${{ github.repository }}  # 部署到当前仓库
          publish_branch: gh-pages  # 发布到 gh-pages 分支
          publish_dir: ./public  # 发布目录
          commit_message: ${{ github.event.head_commit.message || 'Auto-deploy from GitHub Actions' }}  # 提交消息
